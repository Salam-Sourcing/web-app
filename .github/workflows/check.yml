name: Web checks
on:
  pull_request:
  push:
    branches: [main, "1.0"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: cp .env.example .env.local
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:release

      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser -- tests/browser/public.spec.ts tests/browser/currency.spec.ts
